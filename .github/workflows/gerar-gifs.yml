name: Gerar GIFs e fichas de treino
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/gerar-gifs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rotina-exercicios-gif
  cancel-in-progress: false
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências gratuitas
        run: pip install -r requirements.txt
      - name: Validar e produzir os sete dias
        run: |
          python scripts/validate.py
          python scripts/audit_originais.py
          python scripts/test_procedural.py
          python scripts/test_capture_pipeline.py
          python scripts/test_world3d.py
          python scripts/test_video_rights.py
          python scripts/test_batch_capture.py
          python scripts/test_review_gate.py
          python -m py_compile scripts/blender_preview.py
          python scripts/build.py --all
          python scripts/qa_gifs.py
          python scripts/plan_captures.py
      - name: Publicar GIFs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if ! git diff --cached --quiet; then
            git commit -m "build: atualizar GIFs animados da semana"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: semana-em-gifs
          path: output/
          retention-days: 30
